<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manus Clone - AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #06B6D4;
      --primary-dark: #0891B2;
      --secondary: #A855F7;
      --background: #0F172A;
      --card-bg: rgba(15, 23, 42, 0.8);
      --foreground: #F8FAFC;
      --muted: #94A3B8;
      --border: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.05);
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--background);
      color: var(--foreground);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      flex-shrink: 0;
    }
    .header-content { max-width: 56rem; margin: 0 auto; text-align: center; }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #06B6D4 0%, #A855F7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .messages-container { flex: 1; overflow-y: auto; padding: 2rem 1rem; }
    .messages-content { max-width: 56rem; margin: 0 auto; display: flex; flex-direction: column; }
    .message { margin-bottom: 1.5rem; display: flex; flex-direction: column; animation: slideIn 0.4s ease-out; }
    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }
    .bubble {
      max-width: 85%;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
    }
    .user .bubble {
      background: linear-gradient(to right, #06B6D4, #A855F7);
      color: white;
      border-radius: 1rem 1rem 0 1rem;
    }
    .assistant .bubble {
      background: var(--glass-bg);
      border: 1px solid var(--border);
      border-radius: 1rem 1rem 1rem 0;
    }
    .logs-container {
      margin-top: 0.75rem;
      width: 100%;
      max-width: 85%;
      background: rgba(6, 182, 212, 0.05);
      border-right: 3px solid var(--primary);
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .log-entry { margin-bottom: 0.5rem; }
    .input-container {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 1.25rem;
      flex-shrink: 0;
    }
    .input-content { max-width: 56rem; margin: 0 auto; }
    .input-wrapper {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .input-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .file-preview {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(6, 182, 212, 0.1);
      padding: 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      color: var(--primary);
    }
    .file-preview.active { display: flex; }
    .upload-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .upload-btn:hover { color: var(--primary); border-color: var(--primary); }
    .remove-file { cursor: pointer; color: #ef4444; }
    textarea {
      flex: 1;
      background: transparent;
      color: var(--foreground);
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1rem;
      resize: none;
    }
    .send-btn {
      background: linear-gradient(to right, #06B6D4, #A855F7);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <h1>Manus Clone</h1>
        <p style="color: var(--muted)">الوكيل الذكي المتطور - ينفذ المهام باستقلالية</p>
      </div>
    </div>
    <div class="messages-container" id="chat">
      <div class="messages-content" id="messages">
        <div class="message assistant">
          <div class="bubble">مرحباً! أنا وكيلك الذكي. كيف يمكنني مساعدتك اليوم؟ يمكنك أن تطلب مني البحث عن معلومات، إجراء حسابات، أو تنفيذ مهام معقدة.</div>
        </div>
      </div>
    </div>
    <div class="input-container">
      <div class="input-content">
        <div class="input-wrapper">
          <div id="filePreview" class="file-preview">
            <span id="fileName"></span>
            <span class="remove-file" id="removeFile">✕</span>
          </div>
          <div class="input-actions">
            <input type="file" id="fileInput" style="display: none;">
            <button class="upload-btn" id="uploadBtn" title="رفع ملف">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </button>
            <textarea id="taskInput" placeholder="اكتب مهمتك هنا..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn">إرسال</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesDiv = document.getElementById('messages');
    const chatContainer = document.getElementById('chat');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const filePreview = document.getElementById('filePreview');
    const fileNameSpan = document.getElementById('fileName');
    const removeFileBtn = document.getElementById('removeFile');

    let currentFileUrl = null;
    let currentFileName = null;

    uploadBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      try {
        uploadBtn.disabled = true;
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (data.success) {
          currentFileUrl = data.file_url;
          currentFileName = data.filename;
          fileNameSpan.textContent = currentFileName;
          filePreview.classList.add('active');
        }
      } catch (error) {
        alert('فشل رفع الملف');
      } finally {
        uploadBtn.disabled = false;
      }
    });

    removeFileBtn.addEventListener('click', () => {
      currentFileUrl = null;
      currentFileName = null;
      filePreview.classList.remove('active');
      fileInput.value = '';
    });

    sendBtn.addEventListener('click', async () => {
      const task = taskInput.value.trim();
      if (!task && !currentFileUrl) return;

      // Add User Message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      let userMsgHtml = `<div class="bubble">${task || 'تم رفع ملف'}</div>`;
      if (currentFileUrl) {
        userMsgHtml += `<div style="font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem;">📎 ${currentFileName}</div>`;
      }
      userMsg.innerHTML = userMsgHtml;
      messagesDiv.appendChild(userMsg);
      
      const taskToSend = task;
      const fileUrlToSend = currentFileUrl;
      
      taskInput.value = '';
      currentFileUrl = null;
      currentFileName = null;
      filePreview.classList.remove('active');

      // Add Assistant Loading Message
      const assistantMsg = document.createElement('div');
      assistantMsg.className = 'message assistant';
      assistantMsg.innerHTML = `<div class="bubble">جاري التفكير وتنفيذ المهمة...</div><div class="logs-container" id="current-logs"></div>`;
      messagesDiv.appendChild(assistantMsg);
      const logsDiv = assistantMsg.querySelector('#current-logs');

      sendBtn.disabled = true;
      chatContainer.scrollTo(0, chatContainer.scrollHeight);

      try {
        const response = await fetch('/task/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task: taskToSend, file_url: fileUrlToSend })
        });
        const data = await response.json();

        if (data.success) {
          // Update Logs
          if (data.logs && data.logs.length > 0) {
            logsDiv.innerHTML = data.logs.map(log => `<div class="log-entry">⚡ ${log}</div>`).join('');
          } else {
            logsDiv.style.display = 'none';
          }
          // Update Final Output
          assistantMsg.querySelector('.bubble').innerHTML = data.output.replace(/\n/g, '<br>');
        } else {
          assistantMsg.querySelector('.bubble').textContent = 'عذراً، حدث خطأ أثناء تنفيذ المهمة.';
        }
      } catch (e) {
        assistantMsg.querySelector('.bubble').textContent = 'فشل الاتصال بالخادم.';
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTo(0, chatContainer.scrollHeight);
      }
    });
  </script>
</body>
</html>
